name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          STATUS=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -o /dev/null -w "%{http_code}" https://predictive-maintenance-ml-maan.streamlit.app)
          echo "HTTP Status: $STATUS"
